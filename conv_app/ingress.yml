apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  annotations:
    # Указывает NGINX Ingress Controller автоматически добавлять HTML-тег <base href="..."> в секцию <head> возвращаемого веб-приложением ответа.
    # Так все относительные пути внутри страницы будут корректно пересчитаны относительно этого нового базового URL.
    nginx.ingress.kubernetes.io/add-base-url: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: conv.test
    http:
      paths:
        # Тип пути
      - pathType: Prefix
        # URL-путь 
        path: "/api"
        backend:
          service:
            # matadata.name необходимого сервиса
            name: conv-api-clusterip
            port:
              # Целевой порт сервиса
              number: 3000
      - pathType: Prefix
        path: "/uploads"
        backend:
          service:
            name: conv-api-clusterip
            port:
              number: 3000
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: conv-app-clusterip
            port: 
              number: 80

