apiVersion: apps/v1
kind: Deployment
metadata:
  name: conv-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conv-api
  template:
    metadata:
      name: conv-api
      labels:
        app: conv-api
    spec:
      containers:
      - name: conv-api
        # указываем версию явно, чтобы избежать проблем совместимости в будущем
        image: antonlarichev/conv-api:1.0
        ports:
          - containerPort: 3000
        env:
          - name: AMQP_USER
            valueFrom:
              secretKeyRef:
                name: conv-api-secret
                key: AMQP_USER
          - name: AMQP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: conv-api-secret
                key: AMQP_PASSWORD
        resources:
          limits:
            memory: "250Mi"
            cpu: "200m"
        volumeMounts:
            # название существующего тома для связывания
          - name: conv-api-data
            # путь монтирования тома в контейнере
            mountPath: /opt/app/uploads
      volumes:
        # название тома, уникально для Pod
        - name: conv-api-data
          # ссылка на PVC, который нужно привязать
          persistentVolumeClaim:
            # имя PVC, который нужно привязать
            claimName: conv-api-pvc